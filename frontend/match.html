<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papi Futbol Moron - Estadisticas del partido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #0b0f14;
        --panel: #141a22;
        --panel-strong: #1b2430;
        --edge: #2b3441;
        --ink: #f5f7fb;
        --muted: #a4b1c2;
        --accent: #f97316;
        --accent-strong: #fb923c;
        --accent-alt: #22d3ee;
        --success: #4ade80;
        --danger: #f87171;
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, rgba(34, 211, 238, 0.18), transparent 48%),
          radial-gradient(circle at 85% 8%, rgba(249, 115, 22, 0.2), transparent 42%),
          linear-gradient(160deg, #06080c 0%, #0b0f14 45%, #0f1723 100%);
        min-height: 100vh;
      }

      body[data-theme="light"] {
        --panel: #f8fafc;
        --panel-strong: #ffffff;
        --edge: #d5deea;
        --ink: #0b0f14;
        --muted: #4b5563;
        --shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
        background: linear-gradient(135deg, #f6f8fb 0%, #ecf1f8 50%, #e7eef7 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        gap: 28px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.12em;
        font-size: 1.4rem;
      }

      .brand-badge {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        object-fit: contain;
        display: block;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--muted);
        font-weight: 600;
      }

      .nav a {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid transparent;
      }

      .nav a:hover {
        border-color: var(--edge);
        color: var(--ink);
      }

      .account {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .pill {
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--edge);
        font-size: 0.85rem;
        color: var(--muted);
      }

      .btn {
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        background: var(--accent);
        color: #0b0f14;
        box-shadow: 0 14px 28px rgba(249, 115, 22, 0.35);
      }

      .btn.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--edge);
        box-shadow: none;
      }

      .theme-toggle {
        padding: 10px 14px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(280px, 1.2fr) minmax(260px, 0.8fr);
        gap: 24px;
      }

      .hero-card {
        background: linear-gradient(135deg, rgba(20, 26, 34, 0.96), rgba(16, 22, 30, 0.9));
        border-radius: 24px;
        padding: 24px;
        border: 1px solid var(--edge);
        box-shadow: var(--shadow);
        display: grid;
        gap: 16px;
      }

      body[data-theme="light"] .hero-card {
        background: #ffffff;
      }

      .hero h1 {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(2.4rem, 5vw, 3.6rem);
        letter-spacing: 0.08em;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(34, 211, 238, 0.12);
        color: var(--accent-alt);
        font-weight: 600;
        font-size: 0.8rem;
      }

      body[data-theme="light"] .badge {
        background: rgba(14, 116, 144, 0.16);
        color: #0e7490;
      }

      .scoreline {
        display: grid;
        gap: 8px;
      }

      .score {
        font-size: 2.6rem;
        font-weight: 700;
      }

      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .panel {
        background: var(--panel);
        border-radius: 20px;
        padding: 18px;
        border: 1px solid var(--edge);
        box-shadow: var(--shadow);
        display: grid;
        gap: 12px;
      }

      .panel-title {
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.08em;
        font-size: 1.3rem;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        gap: 12px;
      }

      .stat-row:last-child {
        border-bottom: none;
      }

      body[data-theme="light"] .stat-row {
        border-bottom-color: rgba(15, 23, 42, 0.08);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .stat-value {
        font-weight: 700;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .table th,
      .table td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table th {
        color: var(--muted);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .Calendario-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .Calendario-controls .btn.secondary {
        padding: 8px 14px;
      }

      .reveal {
        opacity: 0;
        transform: translateY(14px);
        transition: 0.6s ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-badge" src="img/logo_imagen.png" alt="Papi Futbol Moron logo" />
          Papi Futbol Moron
        </div>
        <nav class="nav">
          <a href="teams.html">Equipos</a>
          <a href="players.html">Jugadores</a>
          <a href="tournament-stats.html">Torneos</a>
          <a href="match.html">Partidos</a>
          <a href="index.html#stats">Estadisticas</a>
        </nav>
        <div class="account">
          <span class="pill">Cuenta</span>
          <button class="btn secondary theme-toggle" type="button" id="theme-toggle">
            Modo claro
          </button>
          <a class="btn secondary" href="login.html">Iniciar sesion</a>
          <a class="btn" href="register.html">Crear cuenta</a>
        </div>
      </header>

      <section class="hero">
        <div class="hero-card reveal">
          <span class="badge">Fecha 3</span>
          <h1 id="match-title">Partido</h1>
          <p id="match-meta"></p>
          <div class="scoreline">
            <div class="score" id="match-score"></div>
            <div class="stat-label" id="match-zone"></div>
          </div>
        </div>
        <div class="hero-card reveal">
          <div class="panel-title">Destacados del partido</div>
          <div class="stat-row">
            <div>
              <div class="stat-label">Shots</div>
              <div class="stat-value" id="match-shots"></div>
            </div>
            <span class="badge" id="match-xg"></span>
          </div>
          <div class="stat-row">
            <div>
              <div class="stat-label">Possession</div>
              <div class="stat-value" id="match-possession"></div>
            </div>
            <span class="badge">Full time</span>
          </div>
          <div class="stat-row">
            <div>
              <div class="stat-label">Tarjetas</div>
              <div class="stat-value" id="match-cards"></div>
            </div>
            <span class="badge">Discipline</span>
          </div>
        </div>
      </section>

      <section class="grid">
        <div class="panel reveal">
          <div class="panel-title">Estadisticas del equipo</div>
          <table class="table">
            <thead>
              <tr>
                <th>Team</th>
                <th>Shots</th>
                <th>xG</th>
                <th>Possession</th>
                <th>Tarjetas</th>
              </tr>
            </thead>
            <tbody id="team-Estadisticas"></tbody>
          </table>
        </div>

        <div class="panel reveal">
          <div class="panel-title">Eventos del partido</div>
          <div id="match-events"></div>
        </div>
      </section>

      <section class="grid">
        <div class="panel reveal">
          <div class="panel-title">Todos los partidos</div>
          <div class="fixture-controls">
            <button class="btn secondary" type="button" id="prev-date">Anterior</button>
            <span class="badge" id="fixture-range">Fecha</span>
            <button class="btn secondary" type="button" id="next-date">Siguiente</button>
          </div>
          <div class="grid" id="fixture-zones"></div>
        </div>
      </section>
    </div>

    <script src="data.js"></script>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const stoRojasTheme = localStorage.getItem("statline-theme");
      const prefersLight =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: light)").matches;
      const initialTheme = stoRojasTheme || (prefersLight ? "light" : "dark");

      if (themeToggle) {
        document.body.dataset.theme = initialTheme;
        themeToggle.textContent =
          document.body.dataset.theme === "light" ? "Modo oscuro" : "Modo claro";
        themeToggle.addEventListener("click", () => {
          const nextTheme = document.body.dataset.theme === "light" ? "dark" : "light";
          document.body.dataset.theme = nextTheme;
          localStorage.setItem("statline-theme", nextTheme);
          themeToggle.textContent = nextTheme === "light" ? "Modo oscuro" : "Modo claro";
        });
      }

      const params = new URLSearchParams(window.location.search);
      const matchId = params.get("match");
      const data = window.StatlineData.tournament;
      const match = window.StatlineData.getMatchById(matchId) || data.results[0];

      const LocalTeam = data.teams.find(team => team.name === match.home);
      const VisitanteTeam = data.teams.find(team => team.name === match.away);
      const LocalLink = `<a href="team.html?team=${LocalTeam ? LocalTeam.id : ""}">${match.home}</a>`;
      const VisitanteLink = `<a href="team.html?team=${VisitanteTeam ? VisitanteTeam.id : ""}">${match.away}</a>`;

      document.getElementById("match-title").innerHTML = `${LocalLink} vs ${VisitanteLink}`;
      document.getElementById("match-meta").textContent = "Papi Futbol 2026 - Final";
      document.getElementById("match-score").textContent = `${match.homeScore} - ${match.awayScore}`;
      document.getElementById("match-zone").textContent = match.zone;

      document.getElementById("match-shots").textContent = `${match.stats.shotsHome} - ${match.stats.shotsAway}`;
      document.getElementById("match-xg").textContent = `xG ${match.stats.xgHome} - ${match.stats.xgAway}`;
      document.getElementById("match-possession").textContent =
        `${match.stats.possessionHome}% - ${match.stats.possessionAway}%`;
      document.getElementById("match-cards").textContent =
        `${match.stats.yellowHome + match.stats.redHome + match.stats.blueHome} - ` +
        `${match.stats.yellowAway + match.stats.redAway + match.stats.blueAway}`;

      const EquipoEstadisticas = document.getElementById("team-Estadisticas");
      EquipoEstadisticas.innerHTML = `
        <tr>
          <td>${LocalLink}</td>
          <td>${match.stats.shotsHome}</td>
          <td>${match.stats.xgHome}</td>
          <td>${match.stats.possessionHome}%</td>
          <td>${match.stats.yellowHome}/${match.stats.redHome}/${match.stats.blueHome}</td>
        </tr>
        <tr>
          <td>${VisitanteLink}</td>
          <td>${match.stats.shotsAway}</td>
          <td>${match.stats.xgAway}</td>
          <td>${match.stats.possessionAway}%</td>
          <td>${match.stats.yellowAway}/${match.stats.redAway}/${match.stats.blueAway}</td>
        </tr>
      `;

      const events = document.getElementById("match-events");
      const eventItems = [
        `${match.home} anoto temprano a los 12 minutos.`,
        `${match.away} empato en el minuto 42.`,
        `Gol decisivo para ${match.home} al 64'.`
      ];
      eventItems.forEach(item => {
        const row = document.createElement("div");
        row.className = "stat-row";
        row.innerHTML = `<div class="stat-label">${item}</div><span class="badge">Evento</span>`;
        events.appendChild(row);
      });

      const fixtureZones = document.getElementById("fixture-zones");
      const fixtureRange = document.getElementById("fixture-range");
      const prevButton = document.getElementById("prev-date");
      const nextButton = document.getElementById("next-date");
      const dates = [...new Set(data.matches.map(item => item.date))].sort();
      const firstUpcomingDate = dates.find(date =>
        data.matches.some(match => match.date === date && match.status !== "final")
      );
      let activeDate = match.date || firstUpcomingDate || dates[0];

      function renderFixtures(date) {
        const fixtures = data.matches.filter(match => match.date === date);
        fixtureZones.innerHTML = "";
        const zones = ["Zone A", "Zone B"];
        zones.forEach(zoneName => {
          const zoneMatches = fixtures.filter(match => match.zone === zoneName);
          const panel = document.createElement("div");
          panel.className = "panel reveal is-visible";
          panel.innerHTML = `
            <div class="panel-title">${zoneName}</div>
            <table class="table">
              <thead>
                <tr>
                  <th>Local</th>
                  <th>Visitante</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody>
                ${zoneMatches
                  .map(fixture => {
                    const Estado = fixture.status === "final"
                      ? `${fixture.homeScore}-${fixture.awayScore}`
                      : "Programado";
                    const LocalId = data.teams.find(t => t.name === fixture.home)?.id || "";
                    const VisitanteId = data.teams.find(t => t.name === fixture.away)?.id || "";
                    return `
                      <tr>
                        <td><a href="team.html?team=${LocalId}">${fixture.home}</a></td>
                        <td><a href="team.html?team=${VisitanteId}">${fixture.away}</a></td>
                        <td><a href="match.html?match=${fixture.id}">${Estado}</a></td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          `;
          fixtureZones.appendChild(panel);
        });
        fixtureRange.textContent = date;
        prevButton.disabled = date === dates[0];
        nextButton.disabled = date === dates[dates.length - 1];
      }

      prevButton.addEventListener("click", () => {
        const index = dates.indexOf(activeDate);
        if (index > 0) {
          activeDate = dates[index - 1];
          renderFixtures(activeDate);
        }
      });

      nextButton.addEventListener("click", () => {
        const index = dates.indexOf(activeDate);
        if (index < dates.length - 1) {
          activeDate = dates[index + 1];
          renderFixtures(activeDate);
        }
      });

      renderFixtures(activeDate);

      const revealItems = document.querySelectorAll(".reveal");
      const observer = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
            }
          });
        },
        { threshold: 0.2 }
      );
      revealItems.forEach(item => observer.observe(item));
    </script>
  </body>
</html>
