
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Futbol Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #131318;
        --muted: #606070;
        --accent: #19725f;
        --accent-strong: #115245;
        --surface: #f6f2ec;
        --surface-alt: #ffffff;
        --border: #e0d8cf;
        --shadow: 0 20px 50px rgba(20, 16, 12, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top, #fef7ee, #efe6db 55%, #e7ddd1);
        min-height: 100vh;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 24px 72px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 32px;
      }

      header h1 {
        font-family: "Newsreader", serif;
        font-size: clamp(2rem, 3vw, 2.7rem);
        margin: 0;
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }

      .card {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .card h2 {
        margin-top: 0;
        font-size: 1.1rem;
        letter-spacing: 0.01em;
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input,
      select,
      button,
      textarea {
        width: 100%;
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
      }

      input:focus,
      select:focus,
      button:focus {
        outline: 2px solid rgba(25, 114, 95, 0.3);
        border-color: var(--accent);
      }

      button {
        background: var(--accent);
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        gap: 12px;
      }

      .row.two {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 0.85rem;
      }

      .list {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .list li {
        background: var(--surface);
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
      }

      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fff4da;
        border: 1px solid #f1d7a1;
        font-size: 0.85rem;
      }

      @media (max-width: 720px) {
        .app {
          padding: 32px 16px 56px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { useEffect, useMemo, useState } = React;
      const html = htm.bind(React.createElement);

      const defaultEndpoint =
        "https://rvvglboqrfhohh6d66du7xvgeq.appsync-api.us-east-1.amazonaws.com/graphql";
      const defaultApiKey = "da2-d3ntxmjqvbc3tcgglmkpe5wrcy";

      function App() {
        const endpoint = defaultEndpoint;
        const apiKey = defaultApiKey;
        const [status, setStatus] = useState("");
        const [loading, setLoading] = useState(false);
        const [tournaments, setTournaments] = useState([]);
        const [phases, setPhases] = useState([]);
        const [groups, setGroups] = useState([]);
        const [rounds, setRounds] = useState([]);
        const [teams, setTeams] = useState([]);
        const [assignments, setAssignments] = useState([]);
        const [selectedTournamentId, setSelectedTournamentId] = useState("");
        const [selectedPhaseId, setSelectedPhaseId] = useState("");
        const [selectedGroupId, setSelectedGroupId] = useState("");
        const [selectedRoundId, setSelectedRoundId] = useState("");
        const [selectedTeamId, setSelectedTeamId] = useState("");

        const [tournamentForm, setTournamentForm] = useState({
          name: "",
          season: "",
          startDate: "",
          endDate: ""
        });
        const [tournamentEdit, setTournamentEdit] = useState({
          id: "",
          name: "",
          season: "",
          startDate: "",
          endDate: ""
        });
        const [phaseForm, setPhaseForm] = useState({
          name: "",
          phaseType: "ZONES",
          phaseOrder: 1
        });
        const [phaseEdit, setPhaseEdit] = useState({
          id: "",
          tournamentId: "",
          name: "",
          phaseType: "ZONES",
          phaseOrder: 1
        });
        const [groupForm, setGroupForm] = useState({
          name: "",
          groupOrder: 1
        });
        const [groupEdit, setGroupEdit] = useState({
          id: "",
          phaseId: "",
          name: "",
          groupOrder: 1
        });
        const [roundForm, setRoundForm] = useState({
          name: "",
          roundOrder: 1
        });
        const [roundEdit, setRoundEdit] = useState({
          id: "",
          phaseId: "",
          name: "",
          roundOrder: 1
        });
        const [teamForm, setTeamForm] = useState({
          name: "",
          shortName: ""
        });
        const [teamEdit, setTeamEdit] = useState({
          id: "",
          tournamentId: "",
          name: "",
          shortName: ""
        });
        const [assignmentForm, setAssignmentForm] = useState({
          teamId: "",
          groupId: "",
          roundId: ""
        });

        const canQuery = useMemo(
          () => endpoint.trim() && apiKey.trim(),
          [endpoint, apiKey]
        );

        const selectedTournament = useMemo(
          () => tournaments.find(item => item.id === selectedTournamentId),
          [tournaments, selectedTournamentId]
        );
        const selectedPhase = useMemo(
          () => phases.find(item => item.id === selectedPhaseId),
          [phases, selectedPhaseId]
        );
        const teamLookup = useMemo(() => {
          const map = {};
          teams.forEach(team => {
            map[team.id] = team;
          });
          return map;
        }, [teams]);
        const groupLookup = useMemo(() => {
          const map = {};
          groups.forEach(group => {
            map[group.id] = group;
          });
          return map;
        }, [groups]);
        const roundLookup = useMemo(() => {
          const map = {};
          rounds.forEach(round => {
            map[round.id] = round;
          });
          return map;
        }, [rounds]);

        function cleanInput(input) {
          return Object.fromEntries(
            Object.entries(input).filter(([, value]) => {
              if (value === undefined || value === null) return false;
              if (typeof value === "string" && value.trim() === "") return false;
              return true;
            })
          );
        }

        async function request(query, variables) {
          if (!canQuery) {
            throw new Error("Add endpoint and API key first.");
          }
          const res = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey
            },
            body: JSON.stringify({ query, variables })
          });
          const json = await res.json();
          if (json.errors && json.errors.length) {
            throw new Error(json.errors[0].message || "GraphQL error");
          }
          return json.data;
        }

        async function refreshTournaments() {
          setLoading(true);
          try {
            const data = await request(
              "query { listTournaments { id name season startDate endDate } }"
            );
            setTournaments(data.listTournaments);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function refreshPhases(tournamentId) {
          if (!tournamentId) return;
          try {
            const data = await request(
              "query ($tournamentId: ID!) { listPhasesByTournament(tournamentId: $tournamentId) { id name phaseType phaseOrder } }",
              { tournamentId }
            );
            setPhases(data.listPhasesByTournament);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshGroups(phaseId) {
          if (!phaseId) return;
          try {
            const data = await request(
              "query ($phaseId: ID!) { listGroupsByPhase(phaseId: $phaseId) { id name groupOrder } }",
              { phaseId }
            );
            setGroups(data.listGroupsByPhase);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshRounds(phaseId) {
          if (!phaseId) return;
          try {
            const data = await request(
              "query ($phaseId: ID!) { listRoundsByPhase(phaseId: $phaseId) { id name roundOrder } }",
              { phaseId }
            );
            setRounds(data.listRoundsByPhase);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshTeams(tournamentId) {
          if (!tournamentId) return;
          try {
            const data = await request(
              "query ($tournamentId: ID!) { listTeamsByTournament(tournamentId: $tournamentId) { id name shortName } }",
              { tournamentId }
            );
            setTeams(data.listTeamsByTournament);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshAssignments(phaseId) {
          if (!phaseId) return;
          try {
            const data = await request(
              "query ($phaseId: ID!) { listAssignmentsByPhase(phaseId: $phaseId) { id teamId groupId roundId } }",
              { phaseId }
            );
            setAssignments(data.listAssignmentsByPhase);
          } catch (err) {
            setStatus(err.message);
          }
        }
        async function createTournament() {
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreateTournamentInput!) { createTournament(input: $input) { id name season startDate endDate } }",
              { input: cleanInput(tournamentForm) }
            );
            setTournaments([data.createTournament, ...tournaments]);
            setTournamentForm({
              name: "",
              season: "",
              startDate: "",
              endDate: ""
            });
            setStatus("Tournament created.");
            setSelectedTournamentId(data.createTournament.id);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updateTournament() {
          if (!selectedTournamentId) return;
          setLoading(true);
          setStatus("");
          try {
            const payload = {
              ...tournamentEdit,
              id: selectedTournamentId
            };
            const data = await request(
              "mutation ($input: UpdateTournamentInput!) { updateTournament(input: $input) { id name season startDate endDate } }",
              { input: cleanInput(payload) }
            );
            setTournaments(
              tournaments.map(item =>
                item.id === data.updateTournament.id
                  ? data.updateTournament
                  : item
              )
            );
            setStatus("Tournament updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function createPhase() {
          if (!selectedTournamentId) {
            setStatus("Select a tournament to add a phase.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreatePhaseInput!) { createPhase(input: $input) { id name phaseType phaseOrder tournamentId } }",
              {
                input: {
                  ...phaseForm,
                  tournamentId: selectedTournamentId,
                  phaseOrder: Number(phaseForm.phaseOrder)
                }
              }
            );
            setPhases([data.createPhase, ...phases]);
            setPhaseForm({
              name: "",
              phaseType: "ZONES",
              phaseOrder: 1
            });
            setStatus("Phase created.");
            setSelectedPhaseId(data.createPhase.id);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updatePhase() {
          if (!selectedPhaseId || !selectedTournamentId) return;
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: UpdatePhaseInput!) { updatePhase(input: $input) { id name phaseType phaseOrder tournamentId } }",
              {
                input: {
                  ...phaseEdit,
                  id: selectedPhaseId,
                  tournamentId: selectedTournamentId,
                  phaseOrder: Number(phaseEdit.phaseOrder)
                }
              }
            );
            setPhases(
              phases.map(item =>
                item.id === data.updatePhase.id ? data.updatePhase : item
              )
            );
            setStatus("Phase updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function createGroup() {
          if (!selectedPhaseId) {
            setStatus("Select a phase to add a group.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreateGroupInput!) { createGroup(input: $input) { id name groupOrder phaseId } }",
              {
                input: {
                  ...groupForm,
                  phaseId: selectedPhaseId,
                  groupOrder: Number(groupForm.groupOrder)
                }
              }
            );
            setGroups([data.createGroup, ...groups]);
            setGroupForm({ name: "", groupOrder: 1 });
            setStatus("Group created.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updateGroup() {
          if (!selectedGroupId || !selectedPhaseId) return;
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: UpdateGroupInput!) { updateGroup(input: $input) { id name groupOrder phaseId } }",
              {
                input: {
                  ...groupEdit,
                  id: selectedGroupId,
                  phaseId: selectedPhaseId,
                  groupOrder: Number(groupEdit.groupOrder)
                }
              }
            );
            setGroups(
              groups.map(item =>
                item.id === data.updateGroup.id ? data.updateGroup : item
              )
            );
            setStatus("Group updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function createRound() {
          if (!selectedPhaseId) {
            setStatus("Select a phase to add a round.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreateRoundInput!) { createRound(input: $input) { id name roundOrder phaseId } }",
              {
                input: {
                  ...roundForm,
                  phaseId: selectedPhaseId,
                  roundOrder: Number(roundForm.roundOrder)
                }
              }
            );
            setRounds([data.createRound, ...rounds]);
            setRoundForm({ name: "", roundOrder: 1 });
            setStatus("Round created.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updateRound() {
          if (!selectedRoundId || !selectedPhaseId) return;
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: UpdateRoundInput!) { updateRound(input: $input) { id name roundOrder phaseId } }",
              {
                input: {
                  ...roundEdit,
                  id: selectedRoundId,
                  phaseId: selectedPhaseId,
                  roundOrder: Number(roundEdit.roundOrder)
                }
              }
            );
            setRounds(
              rounds.map(item =>
                item.id === data.updateRound.id ? data.updateRound : item
              )
            );
            setStatus("Round updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function createTeam() {
          if (!selectedTournamentId) {
            setStatus("Select a tournament to add a team.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreateTeamInput!) { createTeam(input: $input) { id name shortName tournamentId } }",
              {
                input: cleanInput({
                  ...teamForm,
                  tournamentId: selectedTournamentId
                })
              }
            );
            setTeams([data.createTeam, ...teams]);
            setTeamForm({ name: "", shortName: "" });
            setStatus("Team created.");
            setSelectedTeamId(data.createTeam.id);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updateTeam() {
          if (!selectedTeamId || !selectedTournamentId) return;
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: UpdateTeamInput!) { updateTeam(input: $input) { id name shortName tournamentId } }",
              {
                input: cleanInput({
                  ...teamEdit,
                  id: selectedTeamId,
                  tournamentId: selectedTournamentId
                })
              }
            );
            setTeams(
              teams.map(item =>
                item.id === data.updateTeam.id ? data.updateTeam : item
              )
            );
            setStatus("Team updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }
        async function assignTeam() {
          if (!selectedTournamentId || !selectedPhaseId) return;
          if (!assignmentForm.teamId) {
            setStatus("Pick a team to assign.");
            return;
          }
          if (selectedPhase?.phaseType === "ZONES" && !assignmentForm.groupId) {
            setStatus("Pick a group for this team.");
            return;
          }
          if (
            selectedPhase?.phaseType === "PLAYOFFS" &&
            !assignmentForm.roundId
          ) {
            setStatus("Pick a round for this team.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            await request(
              "mutation ($input: AssignTeamInput!) { assignTeamToPhase(input: $input) { id teamId groupId roundId } }",
              {
                input: cleanInput({
                  tournamentId: selectedTournamentId,
                  phaseId: selectedPhaseId,
                  teamId: assignmentForm.teamId,
                  groupId: assignmentForm.groupId,
                  roundId: assignmentForm.roundId
                })
              }
            );
            setStatus("Team assigned.");
            setAssignmentForm({
              teamId: "",
              groupId: "",
              roundId: ""
            });
            refreshAssignments(selectedPhaseId);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        useEffect(() => {
          if (canQuery) {
            refreshTournaments();
          }
        }, [canQuery]);

        useEffect(() => {
          if (!selectedTournamentId) {
            setPhases([]);
            setTeams([]);
            setSelectedPhaseId("");
            setTournamentEdit({
              id: "",
              name: "",
              season: "",
              startDate: "",
              endDate: ""
            });
            return;
          }
          refreshPhases(selectedTournamentId);
          refreshTeams(selectedTournamentId);
          if (selectedTournament) {
            setTournamentEdit({
              id: selectedTournament.id,
              name: selectedTournament.name || "",
              season: selectedTournament.season || "",
              startDate: selectedTournament.startDate || "",
              endDate: selectedTournament.endDate || ""
            });
          }
        }, [selectedTournamentId, selectedTournament]);

        useEffect(() => {
          if (!selectedPhaseId) {
            setGroups([]);
            setRounds([]);
            setAssignments([]);
            setSelectedGroupId("");
            setSelectedRoundId("");
            setPhaseEdit({
              id: "",
              tournamentId: "",
              name: "",
              phaseType: "ZONES",
              phaseOrder: 1
            });
            return;
          }
          refreshGroups(selectedPhaseId);
          refreshRounds(selectedPhaseId);
          refreshAssignments(selectedPhaseId);
          if (selectedPhase) {
            setPhaseEdit({
              id: selectedPhase.id,
              tournamentId: selectedTournamentId,
              name: selectedPhase.name || "",
              phaseType: selectedPhase.phaseType || "ZONES",
              phaseOrder: selectedPhase.phaseOrder || 1
            });
          }
        }, [selectedPhaseId, selectedPhase, selectedTournamentId]);

        useEffect(() => {
          if (!selectedGroupId) {
            setGroupEdit({
              id: "",
              phaseId: selectedPhaseId,
              name: "",
              groupOrder: 1
            });
            return;
          }
          const group = groups.find(item => item.id === selectedGroupId);
          if (group) {
            setGroupEdit({
              id: group.id,
              phaseId: selectedPhaseId,
              name: group.name || "",
              groupOrder: group.groupOrder || 1
            });
          }
        }, [selectedGroupId, groups, selectedPhaseId]);

        useEffect(() => {
          if (!selectedRoundId) {
            setRoundEdit({
              id: "",
              phaseId: selectedPhaseId,
              name: "",
              roundOrder: 1
            });
            return;
          }
          const round = rounds.find(item => item.id === selectedRoundId);
          if (round) {
            setRoundEdit({
              id: round.id,
              phaseId: selectedPhaseId,
              name: round.name || "",
              roundOrder: round.roundOrder || 1
            });
          }
        }, [selectedRoundId, rounds, selectedPhaseId]);

        useEffect(() => {
          if (!selectedTeamId) {
            setTeamEdit({
              id: "",
              tournamentId: selectedTournamentId,
              name: "",
              shortName: ""
            });
            return;
          }
          const team = teams.find(item => item.id === selectedTeamId);
          if (team) {
            setTeamEdit({
              id: team.id,
              tournamentId: selectedTournamentId,
              name: team.name || "",
              shortName: team.shortName || ""
            });
          }
        }, [selectedTeamId, teams, selectedTournamentId]);
        return html`
          <div className="app">
            <header>
              <div>
                <h1>Futbol Admin</h1>
                <p>Manage tournaments, phases, groups, rounds, and teams.</p>
              </div>
              <div className="pill">
                ${loading ? "Saving..." : "Ready"}
              </div>
            </header>

            <section className="grid">
              <div className="card stack">
                <h2>Tournaments</h2>
                <ul className="list">
                  ${tournaments.map(
                    tournament => html`
                      <li>
                        <div>
                          <strong>${tournament.name}</strong>
                          <div className="muted">
                            ${tournament.season || "Season TBD"}
                          </div>
                        </div>
                        <button
                          onClick=${() => {
                            setSelectedTournamentId(tournament.id);
                            setSelectedPhaseId("");
                          }}
                        >
                          Open
                        </button>
                      </li>
                    `
                  )}
                </ul>
                <h3 className="muted">Create tournament</h3>
                <div>
                  <label>Name</label>
                  <input
                    value=${tournamentForm.name}
                    onInput=${e =>
                      setTournamentForm({
                        ...tournamentForm,
                        name: e.target.value
                      })}
                    placeholder="Liga Apertura"
                  />
                </div>
                <div className="row two">
                  <div>
                    <label>Season</label>
                    <input
                      value=${tournamentForm.season}
                      onInput=${e =>
                        setTournamentForm({
                          ...tournamentForm,
                          season: e.target.value
                        })}
                      placeholder="2025"
                    />
                  </div>
                  <div>
                    <label>Start date</label>
                    <input
                      value=${tournamentForm.startDate}
                      onInput=${e =>
                        setTournamentForm({
                          ...tournamentForm,
                          startDate: e.target.value
                        })}
                      placeholder="2025-02-15"
                    />
                  </div>
                </div>
                <div>
                  <label>End date</label>
                  <input
                    value=${tournamentForm.endDate}
                    onInput=${e =>
                      setTournamentForm({
                        ...tournamentForm,
                        endDate: e.target.value
                      })}
                    placeholder="2025-07-20"
                  />
                </div>
                <button disabled=${!canQuery} onClick=${createTournament}>
                  Create tournament
                </button>
              </div>

              <div className="card stack">
                <h2>Tournament settings</h2>
                <div>
                  <label>Tournament</label>
                  <div className="pill">
                    ${selectedTournament
                      ? selectedTournament.name
                      : "Select a tournament"}
                  </div>
                </div>
                ${selectedTournament
                  ? html`
                      <div>
                        <label>Name</label>
                        <input
                          value=${tournamentEdit.name}
                          onInput=${e =>
                            setTournamentEdit({
                              ...tournamentEdit,
                              name: e.target.value
                            })}
                        />
                      </div>
                      <div className="row two">
                        <div>
                          <label>Season</label>
                          <input
                            value=${tournamentEdit.season}
                            onInput=${e =>
                              setTournamentEdit({
                                ...tournamentEdit,
                                season: e.target.value
                              })}
                          />
                        </div>
                        <div>
                          <label>Start date</label>
                          <input
                            value=${tournamentEdit.startDate}
                            onInput=${e =>
                              setTournamentEdit({
                                ...tournamentEdit,
                                startDate: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <div>
                        <label>End date</label>
                        <input
                          value=${tournamentEdit.endDate}
                          onInput=${e =>
                            setTournamentEdit({
                              ...tournamentEdit,
                              endDate: e.target.value
                            })}
                        />
                      </div>
                      <button onClick=${updateTournament} disabled=${!canQuery}>
                        Save tournament
                      </button>
                    `
                  : html`<div className="muted">Select a tournament.</div>`}
              </div>

              <div className="card stack">
                <h2>Phases</h2>
                <div className="muted">
                  ${selectedTournament
                    ? "Linked to selected tournament."
                    : "Select a tournament first."}
                </div>
                <ul className="list">
                  ${phases.map(
                    phase => html`
                      <li>
                        <div>
                          <strong>${phase.name}</strong>
                          <div className="muted">${phase.phaseType}</div>
                        </div>
                        <button
                          onClick=${() => {
                            setSelectedPhaseId(phase.id);
                            setSelectedGroupId("");
                            setSelectedRoundId("");
                          }}
                        >
                          Open
                        </button>
                      </li>
                    `
                  )}
                </ul>
                <h3 className="muted">Create phase</h3>
                <div>
                  <label>Phase name</label>
                  <input
                    value=${phaseForm.name}
                    onInput=${e =>
                      setPhaseForm({ ...phaseForm, name: e.target.value })}
                    placeholder="Group Stage"
                  />
                </div>
                <div className="row two">
                  <div>
                    <label>Type</label>
                    <select
                      value=${phaseForm.phaseType}
                      onChange=${e =>
                        setPhaseForm({
                          ...phaseForm,
                          phaseType: e.target.value
                        })}
                    >
                      <option value="ZONES">Zones</option>
                      <option value="PLAYOFFS">Playoffs</option>
                    </select>
                  </div>
                  <div>
                    <label>Order</label>
                    <input
                      type="number"
                      min="1"
                      value=${phaseForm.phaseOrder}
                      onInput=${e =>
                        setPhaseForm({
                          ...phaseForm,
                          phaseOrder: e.target.value
                        })}
                    />
                  </div>
                </div>
                <button disabled=${!canQuery} onClick=${createPhase}>
                  Create phase
                </button>
              </div>

              <div className="card stack">
                <h2>Phase settings</h2>
                ${selectedPhase
                  ? html`
                      <div>
                        <label>Phase name</label>
                        <input
                          value=${phaseEdit.name}
                          onInput=${e =>
                            setPhaseEdit({ ...phaseEdit, name: e.target.value })}
                        />
                      </div>
                      <div className="row two">
                        <div>
                          <label>Type</label>
                          <select
                            value=${phaseEdit.phaseType}
                            onChange=${e =>
                              setPhaseEdit({
                                ...phaseEdit,
                                phaseType: e.target.value
                              })}
                          >
                            <option value="ZONES">Zones</option>
                            <option value="PLAYOFFS">Playoffs</option>
                          </select>
                        </div>
                        <div>
                          <label>Order</label>
                          <input
                            type="number"
                            min="1"
                            value=${phaseEdit.phaseOrder}
                            onInput=${e =>
                              setPhaseEdit({
                                ...phaseEdit,
                                phaseOrder: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <button onClick=${updatePhase} disabled=${!canQuery}>
                        Save phase
                      </button>
                    `
                  : html`<div className="muted">Select a phase.</div>`}
              </div>

              <div className="card stack">
                <h2>Teams</h2>
                <div className="muted">
                  ${selectedTournament
                    ? "Teams belong to the tournament."
                    : "Select a tournament first."}
                </div>
                <ul className="list">
                  ${teams.map(
                    team => html`
                      <li>
                        <div>
                          <strong>${team.name}</strong>
                          <div className="muted">${team.shortName || "--"}</div>
                        </div>
                        <button onClick=${() => setSelectedTeamId(team.id)}>
                          Edit
                        </button>
                      </li>
                    `
                  )}
                </ul>
                <h3 className="muted">Create team</h3>
                <div className="row two">
                  <div>
                    <label>Team name</label>
                    <input
                      value=${teamForm.name}
                      onInput=${e =>
                        setTeamForm({ ...teamForm, name: e.target.value })}
                      placeholder="River Plate"
                    />
                  </div>
                  <div>
                    <label>Short name</label>
                    <input
                      value=${teamForm.shortName}
                      onInput=${e =>
                        setTeamForm({
                          ...teamForm,
                          shortName: e.target.value
                        })}
                      placeholder="RIV"
                    />
                  </div>
                </div>
                <button disabled=${!canQuery} onClick=${createTeam}>
                  Create team
                </button>
                <h3 className="muted">Edit team</h3>
                <div>
                  <label>Selected team</label>
                  <select
                    value=${selectedTeamId}
                    onChange=${e => setSelectedTeamId(e.target.value)}
                  >
                    <option value="">Select team</option>
                    ${teams.map(
                      team =>
                        html`<option value=${team.id}>${team.name}</option>`
                    )}
                  </select>
                </div>
                <div className="row two">
                  <div>
                    <label>Name</label>
                    <input
                      value=${teamEdit.name}
                      onInput=${e =>
                        setTeamEdit({ ...teamEdit, name: e.target.value })}
                    />
                  </div>
                  <div>
                    <label>Short name</label>
                    <input
                      value=${teamEdit.shortName}
                      onInput=${e =>
                        setTeamEdit({
                          ...teamEdit,
                          shortName: e.target.value
                        })}
                    />
                  </div>
                </div>
                <button onClick=${updateTeam} disabled=${!canQuery}>
                  Save team
                </button>
              </div>
            </section>
            <section className="grid" style=${{ marginTop: "28px" }}>
              <div className="card stack">
                <h2>Phase structure</h2>
                ${selectedPhase
                  ? html`
                      ${phaseEdit.phaseType === "ZONES"
                        ? html`
                            <div className="muted">
                              Groups belong to this phase.
                            </div>
                            <ul className="list">
                              ${groups.map(
                                group => html`
                                  <li>
                                    <div>
                                      <strong>${group.name}</strong>
                                      <div className="muted">
                                        Order ${group.groupOrder}
                                      </div>
                                    </div>
                                    <button
                                      onClick=${() =>
                                        setSelectedGroupId(group.id)}
                                    >
                                      Edit
                                    </button>
                                  </li>
                                `
                              )}
                            </ul>
                            <h3 className="muted">Create group</h3>
                            <div className="row two">
                              <div>
                                <label>Group name</label>
                                <input
                                  value=${groupForm.name}
                                  onInput=${e =>
                                    setGroupForm({
                                      ...groupForm,
                                      name: e.target.value
                                    })}
                                  placeholder="Group A"
                                />
                              </div>
                              <div>
                                <label>Order</label>
                                <input
                                  type="number"
                                  min="1"
                                  value=${groupForm.groupOrder}
                                  onInput=${e =>
                                    setGroupForm({
                                      ...groupForm,
                                      groupOrder: e.target.value
                                    })}
                                />
                              </div>
                            </div>
                            <button onClick=${createGroup} disabled=${!canQuery}>
                              Create group
                            </button>
                            <h3 className="muted">Edit group</h3>
                            <div>
                              <label>Selected group</label>
                              <select
                                value=${selectedGroupId}
                                onChange=${e =>
                                  setSelectedGroupId(e.target.value)}
                              >
                                <option value="">Select group</option>
                                ${groups.map(
                                  group =>
                                    html`<option value=${group.id}>
                                      ${group.name}
                                    </option>`
                                )}
                              </select>
                            </div>
                            <div className="row two">
                              <div>
                                <label>Name</label>
                                <input
                                  value=${groupEdit.name}
                                  onInput=${e =>
                                    setGroupEdit({
                                      ...groupEdit,
                                      name: e.target.value
                                    })}
                                />
                              </div>
                              <div>
                                <label>Order</label>
                                <input
                                  type="number"
                                  min="1"
                                  value=${groupEdit.groupOrder}
                                  onInput=${e =>
                                    setGroupEdit({
                                      ...groupEdit,
                                      groupOrder: e.target.value
                                    })}
                                />
                              </div>
                            </div>
                            <button onClick=${updateGroup} disabled=${!canQuery}>
                              Save group
                            </button>
                          `
                        : html`
                            <div className="muted">
                              Rounds belong to this phase.
                            </div>
                            <ul className="list">
                              ${rounds.map(
                                round => html`
                                  <li>
                                    <div>
                                      <strong>${round.name}</strong>
                                      <div className="muted">
                                        Order ${round.roundOrder}
                                      </div>
                                    </div>
                                    <button
                                      onClick=${() =>
                                        setSelectedRoundId(round.id)}
                                    >
                                      Edit
                                    </button>
                                  </li>
                                `
                              )}
                            </ul>
                            <h3 className="muted">Create round</h3>
                            <div className="row two">
                              <div>
                                <label>Round name</label>
                                <input
                                  value=${roundForm.name}
                                  onInput=${e =>
                                    setRoundForm({
                                      ...roundForm,
                                      name: e.target.value
                                    })}
                                  placeholder="Quarterfinals"
                                />
                              </div>
                              <div>
                                <label>Order</label>
                                <input
                                  type="number"
                                  min="1"
                                  value=${roundForm.roundOrder}
                                  onInput=${e =>
                                    setRoundForm({
                                      ...roundForm,
                                      roundOrder: e.target.value
                                    })}
                                />
                              </div>
                            </div>
                            <button onClick=${createRound} disabled=${!canQuery}>
                              Create round
                            </button>
                            <h3 className="muted">Edit round</h3>
                            <div>
                              <label>Selected round</label>
                              <select
                                value=${selectedRoundId}
                                onChange=${e =>
                                  setSelectedRoundId(e.target.value)}
                              >
                                <option value="">Select round</option>
                                ${rounds.map(
                                  round =>
                                    html`<option value=${round.id}>
                                      ${round.name}
                                    </option>`
                                )}
                              </select>
                            </div>
                            <div className="row two">
                              <div>
                                <label>Name</label>
                                <input
                                  value=${roundEdit.name}
                                  onInput=${e =>
                                    setRoundEdit({
                                      ...roundEdit,
                                      name: e.target.value
                                    })}
                                />
                              </div>
                              <div>
                                <label>Order</label>
                                <input
                                  type="number"
                                  min="1"
                                  value=${roundEdit.roundOrder}
                                  onInput=${e =>
                                    setRoundEdit({
                                      ...roundEdit,
                                      roundOrder: e.target.value
                                    })}
                                />
                              </div>
                            </div>
                            <button onClick=${updateRound} disabled=${!canQuery}>
                              Save round
                            </button>
                          `}
                    `
                  : html`<div className="muted">Select a phase.</div>`}
              </div>

              <div className="card stack">
                <h2>Assign teams</h2>
                ${selectedPhase
                  ? html`
                      <div className="muted">
                        Each team can be assigned once per phase.
                      </div>
                      <div>
                        <label>Team</label>
                        <select
                          value=${assignmentForm.teamId}
                          onChange=${e =>
                            setAssignmentForm({
                              ...assignmentForm,
                              teamId: e.target.value
                            })}
                        >
                          <option value="">Select team</option>
                          ${teams.map(
                            team =>
                              html`<option value=${team.id}>
                                ${team.name}
                              </option>`
                          )}
                        </select>
                      </div>
                      ${phaseEdit.phaseType === "ZONES"
                        ? html`
                            <div>
                              <label>Group</label>
                              <select
                                value=${assignmentForm.groupId}
                                onChange=${e =>
                                  setAssignmentForm({
                                    ...assignmentForm,
                                    groupId: e.target.value
                                  })}
                              >
                                <option value="">Select group</option>
                                ${groups.map(
                                  group =>
                                    html`<option value=${group.id}>
                                      ${group.name}
                                    </option>`
                                )}
                              </select>
                            </div>
                          `
                        : html`
                            <div>
                              <label>Round</label>
                              <select
                                value=${assignmentForm.roundId}
                                onChange=${e =>
                                  setAssignmentForm({
                                    ...assignmentForm,
                                    roundId: e.target.value
                                  })}
                              >
                                <option value="">Select round</option>
                                ${rounds.map(
                                  round =>
                                    html`<option value=${round.id}>
                                      ${round.name}
                                    </option>`
                                )}
                              </select>
                            </div>
                          `}
                      <button onClick=${assignTeam} disabled=${!canQuery}>
                        Assign team
                      </button>
                      <h3 className="muted">Assignments</h3>
                      <ul className="list">
                        ${assignments.map(assignment => {
                          const team = teamLookup[assignment.teamId];
                          const group = assignment.groupId
                            ? groupLookup[assignment.groupId]
                            : null;
                          const round = assignment.roundId
                            ? roundLookup[assignment.roundId]
                            : null;
                          const label = group
                            ? group.name
                            : round
                            ? round.name
                            : "Unassigned";
                          return html`
                            <li>
                              <div>
                                <strong>${team ? team.name : "Team"}</strong>
                                <div className="muted">${label}</div>
                              </div>
                            </li>
                          `;
                        })}
                      </ul>
                    `
                  : html`<div className="muted">Select a phase.</div>`}
              </div>
            </section>

            ${status ? html`<div className="status">${status}</div>` : ""}
          </div>
        `;
      }

      ReactDOM.createRoot(document.getElementById("app")).render(
        html`<${App} />`
      );
    </script>
  </body>
</html>
