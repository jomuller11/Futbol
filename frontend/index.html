<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello AppSync Demo</title>
  </head>
  <body>
    <h1>Hello AppSync</h1>
    <p>Replace the values below with the CloudFormation outputs after deploy.</p>
    <label>GraphQL Endpoint: <input id="graphqlEndpoint" size="60" value="https://rvvglboqrfhohh6d66du7xvgeq.appsync-api.us-east-1.amazonaws.com/graphql" /></label><br/>
    <label>API Key: <input id="apiKey" size="60" value="da2-d3ntxmjqvbc3tcgglmkpe5wrcy" /></label><br/>
    <button id="getMsg">Get Message</button>
    <button id="createMsg">Create Message</button>
    <pre id="output"></pre>

    <script>
      const out = id => document.getElementById(id);
      document.getElementById('getMsg').onclick = async () => {
        const ep = out('graphqlEndpoint').value.trim();
        const key = out('apiKey').value.trim();
        if (!ep || !key) return alert('Set endpoint and API key');
        const query = `query GetMessage($id: ID!){ getMessage(id:$id){ id content } }`;
        const res = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': key },
          body: JSON.stringify({ query, variables: { id: '1' } })
        });
        out('output').textContent = JSON.stringify(await res.json(), null, 2);
      };
      document.getElementById('createMsg').onclick = async () => {
        const ep = out('graphqlEndpoint').value.trim();
        const key = out('apiKey').value.trim();
        if (!ep || !key) return alert('Set endpoint and API key');
        const mutation = `mutation Create($id: ID!, $content: String!){ createMessage(id:$id, content:$content){ id content } }`;
        const res = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': key },
          body: JSON.stringify({ query: mutation, variables: { id: '1', content: 'Hello from demo' } })
        });
        out('output').textContent = JSON.stringify(await res.json(), null, 2);
      };
    </script>
  </body>
</html>
