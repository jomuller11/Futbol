
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Futbol Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #0b0f17;
        --muted: #5b6675;
        --blue: #2b67f6;
        --blue-strong: #1f4fd6;
        --orange: #ff8a3d;
        --orange-strong: #f97316;
        --surface: #eef3ff;
        --surface-alt: #ffffff;
        --border: #dde6fb;
        --shadow: 0 22px 40px rgba(15, 23, 42, 0.12);
        --sidebar: #11131b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, #d8e7ff 0%, #fef3e7 58%, #fff7ed 100%);
        min-height: 100vh;
      }

      .shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 100vh;
        padding: 24px;
        gap: 20px;
      }

      .sidebar {
        background: var(--sidebar);
        border-radius: 28px;
        padding: 22px 18px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        color: #fff;
      }

      .logo {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: #1b1f2a;
        display: grid;
        place-items: center;
        font-weight: 700;
      }

      .nav-icon {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.12);
        display: grid;
        place-items: center;
        font-size: 0.75rem;
      }

      .nav-item {
        border: 1px solid transparent;
        background: transparent;
        color: inherit;
        padding: 10px 12px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        cursor: pointer;
        font: inherit;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .nav-item.active {
        background: #fff;
        color: #11131b;
        box-shadow: 0 12px 20px rgba(15, 23, 42, 0.2);
      }

      .nav-item.active .nav-icon {
        background: #11131b;
        color: #fff;
      }

      .nav-title {
        font-weight: 600;
      }

      .nav-sub {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.6);
      }

      .nav-item.active .nav-sub {
        color: #4b5563;
      }
      }

      .main {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 28px;
        padding: 28px 32px 36px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        background: #f5f7fd;
        border: 1px solid var(--border);
        min-width: 220px;
      }

      .search input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font: inherit;
      }

      .top-nav {
        display: flex;
        gap: 18px;
        color: var(--muted);
        font-weight: 600;
      }

      .top-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 0.85rem;
      }

      .btn {
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 600;
        border: none;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 12px 24px rgba(43, 103, 246, 0.25);
      }

      .btn.primary:hover {
        background: var(--blue-strong);
      }

      .btn.ghost {
        background: #fff;
        border: 1px solid var(--border);
        color: var(--ink);
      }

      .hero {
        margin-top: 28px;
        display: grid;
        gap: 16px;
      }

      .hero h1 {
        font-family: "Newsreader", serif;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        margin: 0;
      }

      .hero .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        color: var(--muted);
      }

      .stat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #f4f8ff;
        border: 1px solid var(--border);
        font-size: 0.85rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 340px) 1fr;
        gap: 24px;
        margin-top: 24px;
      }

      .layout.single {
        grid-template-columns: 1fr;
      }

      .panel {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.05rem;
      }

      .tabs {
        display: inline-flex;
        gap: 8px;
        background: #f3f6ff;
        padding: 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
      }

      .tab {
        border: none;
        background: transparent;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        color: var(--muted);
      }

      .tab.active {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 10px 16px rgba(20, 20, 40, 0.08);
      }

      .tab:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .table th,
      .table td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
      }

      .table th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .table tr:hover {
        background: #f3f6ff;
      }

      .form-grid {
        display: grid;
        gap: 12px;
      }

      .form-row {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input,
      select {
        width: 100%;
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
      }

      input:focus,
      select:focus {
        outline: 2px solid rgba(43, 103, 246, 0.2);
        border-color: var(--blue);
      }

      .status {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fff4da;
        border: 1px solid #f1d7a1;
        font-size: 0.85rem;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 10px;
        background: rgba(255, 138, 61, 0.18);
        color: var(--orange-strong);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .empty {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 16px;
        border: 1px dashed var(--border);
        border-radius: 14px;
        text-align: center;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .section-tree {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tree-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }

      .tree-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--blue);
      }

      .tree-branch {
        margin-left: 18px;
        display: grid;
        gap: 6px;
      }

      .tree-leaf {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .tree-leaf.active {
        color: var(--ink);
        font-weight: 600;
      }

      .split {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .subpanel {
        border-radius: 16px;
        padding: 16px;
        background: #f7faff;
        border: 1px solid var(--border);
      }

      .subpanel.players-panel {
        position: relative;
      }

      .fab {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: none;
        background: var(--orange);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(249, 115, 22, 0.3);
      }

      .fab:hover {
        background: var(--orange-strong);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(11, 15, 23, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 10;
      }

      .modal {
        width: min(760px, 100%);
        max-height: min(90vh, 900px);
        overflow: auto;
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .modal-title {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      @media (max-width: 1024px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
        }

        .nav-item {
          flex: 1;
          justify-content: center;
          padding: 10px;
        }

        .nav-sub {
          display: none;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { useEffect, useMemo, useState } = React;
      const html = htm.bind(React.createElement);

      const defaultEndpoint =
        "https://rvvglboqrfhohh6d66du7xvgeq.appsync-api.us-east-1.amazonaws.com/graphql";
      const defaultApiKey = "da2-d3ntxmjqvbc3tcgglmkpe5wrcy";

      function App() {
        const endpoint = defaultEndpoint;
        const apiKey = defaultApiKey;
        const [status, setStatus] = useState("");
        const [loading, setLoading] = useState(false);
        const [tournaments, setTournaments] = useState([]);
        const [phases, setPhases] = useState([]);
        const [groups, setGroups] = useState([]);
        const [rounds, setRounds] = useState([]);
        const [teams, setTeams] = useState([]);
        const [players, setPlayers] = useState([]);
        const [assignments, setAssignments] = useState([]);
        const [selectedTournamentId, setSelectedTournamentId] = useState("");
        const [selectedPhaseId, setSelectedPhaseId] = useState("");
        const [selectedGroupId, setSelectedGroupId] = useState("");
        const [selectedRoundId, setSelectedRoundId] = useState("");
        const [selectedTeamId, setSelectedTeamId] = useState("");
        const [activeSection, setActiveSection] = useState("tournaments");
        const [activeTab, setActiveTab] = useState("details");
        const [isCreatingTournament, setIsCreatingTournament] = useState(false);
        const [isCreatingPlayer, setIsCreatingPlayer] = useState(false);
        const [selectedPlayerId, setSelectedPlayerId] = useState("");

        const [tournamentForm, setTournamentForm] = useState({
          name: "",
          season: "",
          startDate: "",
          endDate: ""
        });
        const [tournamentEdit, setTournamentEdit] = useState({
          id: "",
          name: "",
          season: "",
          startDate: "",
          endDate: ""
        });
        const [phaseForm, setPhaseForm] = useState({
          name: "",
          phaseType: "ZONES",
          phaseOrder: 1
        });
        const [phaseEdit, setPhaseEdit] = useState({
          id: "",
          tournamentId: "",
          name: "",
          phaseType: "ZONES",
          phaseOrder: 1
        });
        const [groupForm, setGroupForm] = useState({
          name: "",
          groupOrder: 1
        });
        const [groupEdit, setGroupEdit] = useState({
          id: "",
          phaseId: "",
          name: "",
          groupOrder: 1
        });
        const [roundForm, setRoundForm] = useState({
          name: "",
          roundOrder: 1
        });
        const [roundEdit, setRoundEdit] = useState({
          id: "",
          phaseId: "",
          name: "",
          roundOrder: 1
        });
        const [teamForm, setTeamForm] = useState({
          name: "",
          shortName: ""
        });
        const [teamEdit, setTeamEdit] = useState({
          id: "",
          tournamentId: "",
          name: "",
          shortName: ""
        });
        const [assignmentForm, setAssignmentForm] = useState({
          teamId: "",
          groupId: "",
          roundId: ""
        });
        const [playerEdit, setPlayerEdit] = useState({
          dni: "",
          name: "",
          lastName: "",
          nickname: "",
          dateOfBirth: "",
          cellphone: "",
          email: "",
          playedBefore: "no",
          aptoMedico: "no",
          position: "",
          puntaje: "",
          referencia: "",
          egresoYear: ""
        });

        const canQuery = useMemo(
          () => endpoint.trim() && apiKey.trim(),
          [endpoint, apiKey]
        );

        const selectedTournament = useMemo(
          () => tournaments.find(item => item.id === selectedTournamentId),
          [tournaments, selectedTournamentId]
        );
        const selectedPhase = useMemo(
          () => phases.find(item => item.id === selectedPhaseId),
          [phases, selectedPhaseId]
        );
        const teamLookup = useMemo(() => {
          const map = {};
          teams.forEach(team => {
            map[team.id] = team;
          });
          return map;
        }, [teams]);
        const groupLookup = useMemo(() => {
          const map = {};
          groups.forEach(group => {
            map[group.id] = group;
          });
          return map;
        }, [groups]);
        const roundLookup = useMemo(() => {
          const map = {};
          rounds.forEach(round => {
            map[round.id] = round;
          });
          return map;
        }, [rounds]);
        const selectedPlayer = useMemo(
          () => players.find(item => item.id === selectedPlayerId),
          [players, selectedPlayerId]
        );

        const showTabs =
          activeSection === "tournaments" &&
          (isCreatingTournament || selectedTournamentId);
        const canOpenSubsections = Boolean(selectedTournamentId);

        function cleanInput(input) {
          return Object.fromEntries(
            Object.entries(input).filter(([, value]) => {
              if (value === undefined || value === null) return false;
              if (typeof value === "string" && value.trim() === "") return false;
              return true;
            })
          );
        }

        async function request(query, variables) {
          if (!canQuery) {
            throw new Error("Add endpoint and API key first.");
          }
          const res = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey
            },
            body: JSON.stringify({ query, variables })
          });
          const json = await res.json();
          if (json.errors && json.errors.length) {
            throw new Error(json.errors[0].message || "GraphQL error");
          }
          return json.data;
        }

        async function refreshTournaments() {
          setLoading(true);
          try {
            const data = await request(
              "query { listTournaments { id name season startDate endDate isActive } }"
            );
            setTournaments(data.listTournaments);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function refreshPhases(tournamentId) {
          if (!tournamentId) return;
          try {
            const data = await request(
              "query ($tournamentId: ID!) { listPhasesByTournament(tournamentId: $tournamentId) { id name phaseType phaseOrder } }",
              { tournamentId }
            );
            setPhases(data.listPhasesByTournament);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshGroups(phaseId) {
          if (!phaseId) return;
          try {
            const data = await request(
              "query ($phaseId: ID!) { listGroupsByPhase(phaseId: $phaseId) { id name groupOrder } }",
              { phaseId }
            );
            setGroups(data.listGroupsByPhase);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshRounds(phaseId) {
          if (!phaseId) return;
          try {
            const data = await request(
              "query ($phaseId: ID!) { listRoundsByPhase(phaseId: $phaseId) { id name roundOrder } }",
              { phaseId }
            );
            setRounds(data.listRoundsByPhase);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshTeams(tournamentId) {
          if (!tournamentId) return;
          try {
            const data = await request(
              "query ($tournamentId: ID!) { listTeamsByTournament(tournamentId: $tournamentId) { id name shortName } }",
              { tournamentId }
            );
            setTeams(data.listTeamsByTournament);
          } catch (err) {
            setStatus(err.message);
          }
        }

        async function refreshAssignments(phaseId) {
          if (!phaseId) return;
          try {
            const data = await request(
              "query ($phaseId: ID!) { listAssignmentsByPhase(phaseId: $phaseId) { id teamId groupId roundId } }",
              { phaseId }
            );
            setAssignments(data.listAssignmentsByPhase);
          } catch (err) {
            setStatus(err.message);
          }
        }
        async function createTournament() {
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreateTournamentInput!) { createTournament(input: $input) { id name season startDate endDate isActive } }",
              { input: cleanInput(tournamentForm) }
            );
            setTournaments([data.createTournament, ...tournaments]);
            setTournamentForm({
              name: "",
              season: "",
              startDate: "",
              endDate: ""
            });
            setStatus("Tournament created.");
            setSelectedTournamentId(data.createTournament.id);
            setIsCreatingTournament(false);
            setActiveTab("details");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updateTournament() {
          if (!selectedTournamentId) return;
          setLoading(true);
          setStatus("");
          try {
            const payload = {
              ...tournamentEdit,
              id: selectedTournamentId,
              isActive: selectedTournament ? selectedTournament.isActive : false
            };
            const data = await request(
              "mutation ($input: UpdateTournamentInput!) { updateTournament(input: $input) { id name season startDate endDate isActive } }",
              { input: cleanInput(payload) }
            );
            setTournaments(
              tournaments.map(item =>
                item.id === data.updateTournament.id
                  ? data.updateTournament
                  : item
              )
            );
            setStatus("Tournament updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function createPhase() {
          if (!selectedTournamentId) {
            setStatus("Select a tournament to add a phase.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreatePhaseInput!) { createPhase(input: $input) { id name phaseType phaseOrder tournamentId } }",
              {
                input: {
                  ...phaseForm,
                  tournamentId: selectedTournamentId,
                  phaseOrder: Number(phaseForm.phaseOrder)
                }
              }
            );
            setPhases([data.createPhase, ...phases]);
            setPhaseForm({
              name: "",
              phaseType: "ZONES",
              phaseOrder: 1
            });
            setStatus("Phase created.");
            setSelectedPhaseId(data.createPhase.id);
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updatePhase() {
          if (!selectedPhaseId || !selectedTournamentId) return;
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: UpdatePhaseInput!) { updatePhase(input: $input) { id name phaseType phaseOrder tournamentId } }",
              {
                input: {
                  ...phaseEdit,
                  id: selectedPhaseId,
                  tournamentId: selectedTournamentId,
                  phaseOrder: Number(phaseEdit.phaseOrder)
                }
              }
            );
            setPhases(
              phases.map(item =>
                item.id === data.updatePhase.id ? data.updatePhase : item
              )
            );
            setStatus("Phase updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function createGroup() {
          if (!selectedPhaseId) {
            setStatus("Select a phase to add a group.");
            return;
          }
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: CreateGroupInput!) { createGroup(input: $input) { id name groupOrder phaseId } }",
              {
                input: {
                  ...groupForm,
                  phaseId: selectedPhaseId,
                  groupOrder: Number(groupForm.groupOrder)
                }
              }
            );
            setGroups([data.createGroup, ...groups]);
            setGroupForm({ name: "", groupOrder: 1 });
            setStatus("Group created.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        async function updateGroup() {
          if (!selectedGroupId || !selectedPhaseId) return;
          setLoading(true);
          setStatus("");
          try {
            const data = await request(
              "mutation ($input: UpdateGroupInput!) { updateGroup(input: $input) { id name groupOrder phaseId } }",
              {
                input: {
                  ...groupEdit,
                  id: selectedGroupId,
                  phaseId: selectedPhaseId,
                  groupOrder: Number(groupEdit.groupOrder)
                }
              }
            );
            setGroups(
              groups.map(item =>
                item.id === data.updateGroup.id ? data.updateGroup : item
              )
            );

          setStatus("");

              "mutation ($input: CreateRoundInput!) { createRound(input: $input) { id name roundOrder phaseId } }",
              {
                input: {
                  ...roundForm,
                  phaseId: selectedPhaseId,
                  roundOrder: Number(roundForm.roundOrder)

            setRounds([data.createRound, ...rounds]);

            setStatus(err.message);

            setLoading(false);

              "mutation ($input: UpdateRoundInput!) { updateRound(input: $input) { id name roundOrder phaseId } }",

                  phaseId: selectedPhaseId,

                input: cleanInput({

          if (selectedPhase?.phaseType === "ZONES" && !assignmentForm.groupId) {

            return;

          setStatus("");

        function handleOpenTournament(id) {

          setSelectedTournamentId(id);
          setSelectedPhaseId("");
          setActiveTab("details");
        }

        async function toggleTournamentActive(id) {
          const target = tournaments.find(tournament => tournament.id === id);
          if (!target) return;
          setLoading(true);
          setStatus("");
          const nextActive = !target.isActive;
          try {
            const updates = [];
            const deactivations = nextActive
              ? tournaments.filter(tournament => tournament.isActive && tournament.id !== id)
              : [];
            updates.push(
              request(
                "mutation ($input: UpdateTournamentInput!) { updateTournament(input: $input) { id name season startDate endDate isActive } }",
                {
                  input: cleanInput({
                    id: target.id,
                    name: target.name,
                    season: target.season,
                    startDate: target.startDate,
                    endDate: target.endDate,
                    isActive: nextActive
                  })
                }
              )
            );
            deactivations.forEach(tournament => {
              updates.push(
                request(
                  "mutation ($input: UpdateTournamentInput!) { updateTournament(input: $input) { id name season startDate endDate isActive } }",
                  {
                    input: cleanInput({
                      id: tournament.id,
                      name: tournament.name,
                      season: tournament.season,
                      startDate: tournament.startDate,
                      endDate: tournament.endDate,
                      isActive: false
                    })
                  }
                )
              );
            });
            const results = await Promise.all(updates);
            const updated = results.map(result => result.updateTournament);
            setTournaments(
              tournaments.map(tournament => {
                const match = updated.find(item => item.id === tournament.id);
                return match ? { ...tournament, ...match } : tournament;
              })
            );
            if (nextActive) {
              setSelectedTournamentId(target.id);
            }
            setStatus("Tournament status updated.");
          } catch (err) {
            setStatus(err.message);
          } finally {
            setLoading(false);
          }
        }

        return html`

                                              <tr>
                                                <td>${phase.name}</td>
                                                <td><span className="tag">${phase.phaseType}</span></td>
                                                <td>${phase.phaseOrder}</td>
                                                <td>
                                                  <button
                                                    className="btn ghost"
                                                    onClick=${() => setSelectedPhaseId(phase.id)}
                                                  >
                                                    Open
                                                  </button>
                                                </td>
                                              </tr>
                                            `
                                          )}
                                        </tbody>
                                      </table>
                                      <div className="form-row">
                                        <div>
                                          <label>Name</label>
                                          <input
                                            value=${phaseForm.name}
                                            onInput=${e => setPhaseForm({ ...phaseForm, name: e.target.value })}
                                          />
                                        </div>
                                        <div>
                                          <label>Type</label>
                                          <select
                                            value=${phaseForm.phaseType}
                                            onChange=${e => setPhaseForm({ ...phaseForm, phaseType: e.target.value })}
                                          >
                                            <option value="ZONES">Zones</option>
                                            <option value="PLAYOFFS">Playoffs</option>
                                          </select>
                                        </div>
                                        <div>
                                          <label>Order</label>
                                          <input
                                            type="number"
                                            min="1"
                                            value=${phaseForm.phaseOrder}
                                            onInput=${e => setPhaseForm({ ...phaseForm, phaseOrder: e.target.value })}
                                          />
                                        </div>
                                      </div>
                                      <button className="btn primary" onClick=${createPhase}>Add phase</button>
                                      ${selectedPhase
                                        ? html`
                                            <div className="form-grid">
                                              <h3>Edit phase</h3>
                                              <div className="form-row">
                                                <div>
                                                  <label>Name</label>
                                                  <input
                                                    value=${phaseEdit.name}
                                                    onInput=${e => setPhaseEdit({ ...phaseEdit, name: e.target.value })}
                                                  />
                                                </div>
                                                <div>
                                                  <label>Type</label>
                                                  <select
                                                    value=${phaseEdit.phaseType}
                                                    onChange=${e => setPhaseEdit({ ...phaseEdit, phaseType: e.target.value })}
                                                  >
                                                    <option value="ZONES">Zones</option>
                                                    <option value="PLAYOFFS">Playoffs</option>
                                                  </select>
                                                </div>
                                                <div>
                                                  <label>Order</label>
                                                  <input
                                                    type="number"
                                                    min="1"
                                                    value=${phaseEdit.phaseOrder}
                                                    onInput=${e => setPhaseEdit({ ...phaseEdit, phaseOrder: e.target.value })}
                                                  />
                                                </div>
                                              </div>
                                              <button className="btn primary" onClick=${updatePhase}>Save phase</button>
                                            </div>
                                          `
                                        : ""}
                                    `}
                              </div>
                            `
                          : ""}

                        ${activeTab === "teams"
                          ? html`
                              <div className="form-grid" style=${{ marginTop: "16px" }}>
                                <h2>Teams</h2>
                                ${!selectedTournamentId
                                  ? html`<div className="empty">Select a tournament.</div>`
                                  : html`
                                      <table className="table">
                                        <thead>
                                          <tr>
                                            <th>Name</th>
                                            <th>Short</th>
                                            <th></th>
                                          </tr>
                                        </thead>
                                        <tbody>
                                          ${teams.map(
                                            team => html`
                                              <tr>
                                                <td>${team.name}</td>
                                                <td>${team.shortName || "--"}</td>
                                                <td>
                                                  <button className="btn ghost" onClick=${() => setSelectedTeamId(team.id)}>
                                                    Edit
                                                  </button>
                                                </td>
                                              </tr>
                                            `
                                          )}
                                        </tbody>
                                      </table>
                                      <div className="form-row">
                                        <div>
                                          <label>Name</label>
                                          <input
                                            value=${teamForm.name}
                                            onInput=${e => setTeamForm({ ...teamForm, name: e.target.value })}
                                          />
                                        </div>
                                        <div>
                                          <label>Short</label>
                                          <input
                                            value=${teamForm.shortName}
                                            onInput=${e => setTeamForm({ ...teamForm, shortName: e.target.value })}
                                          />
                                        </div>
                                      </div>
                                      <button className="btn primary" onClick=${createTeam}>Add team</button>
                                      ${selectedTeamId
                                        ? html`
                                            <div className="form-row">
                                              <div>
                                                <label>Edit name</label>
                                                <input
                                                  value=${teamEdit.name}
                                                  onInput=${e => setTeamEdit({ ...teamEdit, name: e.target.value })}
                                                />
                                              </div>
                                              <div>
                                                <label>Edit short</label>
                                                <input
                                                  value=${teamEdit.shortName}
                                                  onInput=${e => setTeamEdit({ ...teamEdit, shortName: e.target.value })}
                                                />
                                              </div>
                                              <div>
                                                <label>&nbsp;</label>
                                                <button className="btn primary" onClick=${updateTeam}>Save team</button>
                                              </div>
                                            </div>
                                          `
                                        : ""}
                                    `}
                              </div>
                            `
                          : ""}

                        ${activeTab === "assign"
                          ? html`
                              <div className="form-grid" style=${{ marginTop: "16px" }}>
                                <h2>${zoneLabel}</h2>
                                ${!selectedPhase
                                  ? html`<div className="empty">Open a phase first.</div>`
                                  : html`
                                      <div className="form-row">
                                        <div>
                                          <label>Team</label>
                                          <select
                                            value=${assignmentForm.teamId}
                                            onChange=${e => setAssignmentForm({ ...assignmentForm, teamId: e.target.value })}
                                          >
                                            <option value="">Select team</option>
                                            ${teams.map(
                                              team => html`<option value=${team.id}>${team.name}</option>`
                                            )}
                                          </select>
                                        </div>
                                        ${isZonesPhase
                                          ? html`
                                              <div>
                                                <label>Group</label>
                                                <select
                                                  value=${assignmentForm.groupId}
                                                  onChange=${e => setAssignmentForm({ ...assignmentForm, groupId: e.target.value })}
                                                >
                                                  <option value="">Select group</option>
                                                  ${groups.map(
                                                    group => html`<option value=${group.id}>${group.name}</option>`
                                                  )}
                                                </select>
                                              </div>
                                            `
                                          : html`
                                              <div>
                                                <label>Round</label>
                                                <select
                                                  value=${assignmentForm.roundId}
                                                  onChange=${e => setAssignmentForm({ ...assignmentForm, roundId: e.target.value })}
                                                >
                                                  <option value="">Select round</option>
                                                  ${rounds.map(
                                                    round => html`<option value=${round.id}>${round.name}</option>`
                                                  )}
                                                </select>
                                              </div>
                                            `}
                                        <div>
                                          <label>&nbsp;</label>
                                          <button className="btn primary" onClick=${assignTeam}>Assign</button>
                                        </div>
                                      </div>
                                      <table className="table">
                                        <thead>
                                          <tr>
                                            <th>Team</th>
                                            <th>Placement</th>
                                          </tr>
                                        </thead>
                                        <tbody>
                                          ${assignments.map(assignment => {
                                            const team = teamLookup[assignment.teamId];
                                            const group = assignment.groupId
                                              ? groupLookup[assignment.groupId]
                                              : null;
                                            const round = assignment.roundId
                                              ? roundLookup[assignment.roundId]
                                              : null;
                                            const label = group
                                              ? group.name
                                              : round
                                              ? round.name
                                              : "Unassigned";
                                            return html`
                                              <tr>
                                                <td>${team ? team.name : "Team"}</td>
                                                <td>${label}</td>
                                              </tr>
                                            `;
                                          })}
                                        </tbody>
                                      </table>
                                    `}
                              </div>
                            `
                          : ""}
                      `
                    : html`<div className="empty">Select a tournament to get started.</div>`}
                </div>
              </div>

              ${status ? html`<div className="status">${status}</div>` : ""}
            </main>
          </div>
          ${activeSection === "players" && showPlayerModal
            ? html`
                <div className="modal-backdrop" onClick=${closePlayerModal}>
                  <div className="modal" onClick=${e => e.stopPropagation()}>
                    <div className="modal-header">
                      <div className="modal-title">
                        ${isCreatingPlayer ? "Create player" : "Player profile"}
                      </div>
                      <button className="btn ghost" onClick=${closePlayerModal}>Close</button>
                    </div>
                    <div className="form-grid">
                      <div className="form-row">
                        <div>
                          <label>DNI</label>
                          <input
                            type="number"
                            value=${playerEdit.dni}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                dni: e.target.value
                              })}
                          />
                        </div>
                        <div>
                          <label>Position</label>
                          <input
                            type="number"
                            value=${playerEdit.position}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                position: e.target.value
                              })}
                          />
                        </div>
                        <div>
                          <label>Puntaje</label>
                          <input
                            type="number"
                            value=${playerEdit.puntaje}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                puntaje: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <div className="form-row">
                        <div>
                          <label>Name</label>
                          <input
                            value=${playerEdit.name}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                name: e.target.value
                              })}
                          />
                        </div>
                        <div>
                          <label>Lastname</label>
                          <input
                            value=${playerEdit.lastName}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                lastName: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <div className="form-row">
                        <div>
                          <label>Nickname</label>
                          <input
                            value=${playerEdit.nickname}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                nickname: e.target.value
                              })}
                          />
                        </div>
                        <div>
                          <label>Date of birth</label>
                          <input
                            value=${playerEdit.dateOfBirth}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                dateOfBirth: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <div className="form-row">
                        <div>
                          <label>Cellphone</label>
                          <input
                            value=${playerEdit.cellphone}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                cellphone: e.target.value
                              })}
                          />
                        </div>
                        <div>
                          <label>Email</label>
                          <input
                            value=${playerEdit.email}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                email: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <div className="form-row">
                        <div>
                          <label>Played before</label>
                          <select
                            value=${playerEdit.playedBefore}
                            onChange=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                playedBefore: e.target.value
                              })}
                          >
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                          </select>
                        </div>
                        <div>
                          <label>Apto medico</label>
                          <select
                            value=${playerEdit.aptoMedico}
                            onChange=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                aptoMedico: e.target.value
                              })}
                          >
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                          </select>
                        </div>
                      </div>
                      <div className="form-row">
                        <div>
                          <label>Referencia</label>
                          <select
                            value=${playerEdit.referencia}
                            onChange=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                referencia: e.target.value
                              })}
                          >
                            <option value="">Select</option>
                            <option value="Padre de Alumno">Padre de Alumno</option>
                            <option value="Padre de ex Alumno">Padre de ex Alumno</option>
                            <option value="Ex alumno">Ex alumno</option>
                            <option value="Docente">Docente</option>
                            <option value="Invitado">Invitado</option>
                            <option value="Hermano marista">Hermano marista</option>
                            <option value="Esposo educadora">Esposo educadora</option>
                            <option value="Abuelo de alumno">Abuelo de alumno</option>
                          </select>
                        </div>
                        <div>
                          <label>Ano de egreso</label>
                          <input
                            type="number"
                            value=${playerEdit.egresoYear}
                            onInput=${e =>
                              setPlayerEdit({
                                ...playerEdit,
                                egresoYear: e.target.value
                              })}
                          />
                        </div>
                      </div>
                      <div className="modal-actions">
                        <button className="btn primary" onClick=${updatePlayerProfile}>
                          ${isCreatingPlayer ? "Create profile" : "Save profile"}
                        </button>
                        <button className="btn ghost" onClick=${closePlayerModal}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              `
            : ""}
        `;
      }

      ReactDOM.createRoot(document.getElementById("app")).render(
        html`<${App} />`
      );
    </script>
  </body>
</html>
