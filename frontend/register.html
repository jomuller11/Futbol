<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Player Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="player-portal.css" />
  </head>
  <body class="portal-body">
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { useEffect, useState } = React;
      const html = htm.bind(React.createElement);

      const THEME_KEY = "statline-theme";
      const getInitialTheme = () => {
        const stored = localStorage.getItem(THEME_KEY);
        if (stored) return stored;
        const prefersLight =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        return prefersLight ? "light" : "dark";
      };
      const applyTheme = theme => {
        document.body.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
      };

      function App() {
        const [theme, setTheme] = useState(getInitialTheme());
        const [form, setForm] = useState({
          dni: "",
          name: "",
          lastName: "",
          nickname: "",
          dateOfBirth: "",
          cellphone: "",
          email: "",
          playedBefore: "no",
          aptoMedico: "no",
          position: "",
          puntaje: "",
          referencia: "",
          egresoYear: ""
        });

        useEffect(() => {
          applyTheme(theme);
        }, [theme]);

        return html`
          <div className="portal-shell">
            <aside className="portal-sidebar">
              <img className="portal-brand" src="img/logo_imagen.png" alt="Papi Futbol Moron logo" />
              <button
                className="portal-button secondary portal-theme-toggle"
                onClick=${() => setTheme(theme === "light" ? "dark" : "light")}
                type="button"
              >
                ${theme === "light" ? "Dark mode" : "Light mode"}
              </button>
              <nav className="portal-nav">
                <div className="portal-nav-group">
                  <div className="portal-nav-title">Public</div>
                  <a className="portal-link" href="tournament-stats.html">Tournament Stats</a>
                  <a className="portal-link" href="teams.html">Teams</a>
                  <a className="portal-link" href="players.html">Players</a>
                </div>
                <div className="portal-nav-group">
                  <div className="portal-nav-title">Account</div>
                  <a className="portal-link active" href="register.html">Register</a>
                  <a className="portal-link" href="login.html">Login</a>
                  <a className="portal-link" href="profile.html">Profile</a>
                </div>
              </nav>
            </aside>

            <main className="portal-main">
              <div className="portal-header">
                <div>
                  <h1 className="portal-title">Create your account</h1>
                  <div className="portal-subtitle">
                    Register to access your profile and the active tournament signup.
                  </div>
                </div>
                <span className="chip">Step 1 of 3</span>
              </div>

              <div className="portal-grid">
                <div className="portal-card">
                  <div className="portal-form">
                    <div className="row">
                      <div>
                        <label>DNI</label>
                        <input
                          type="number"
                          value=${form.dni}
                          onInput=${e => setForm({ ...form, dni: e.target.value })}
                        />
                      </div>
                      <div>
                        <label>Position</label>
                        <input
                          type="number"
                          value=${form.position}
                          onInput=${e => setForm({ ...form, position: e.target.value })}
                        />
                      </div>
                      <div>
                        <label>Puntaje</label>
                        <input
                          type="number"
                          value=${form.puntaje}
                          onInput=${e => setForm({ ...form, puntaje: e.target.value })}
                        />
                      </div>
                    </div>
                    <div className="row">
                      <div>
                        <label>Name</label>
                        <input
                          value=${form.name}
                          onInput=${e => setForm({ ...form, name: e.target.value })}
                        />
                      </div>
                      <div>
                        <label>Lastname</label>
                        <input
                          value=${form.lastName}
                          onInput=${e => setForm({ ...form, lastName: e.target.value })}
                        />
                      </div>
                    </div>
                    <div className="row">
                      <div>
                        <label>Nickname</label>
                        <input
                          value=${form.nickname}
                          onInput=${e => setForm({ ...form, nickname: e.target.value })}
                        />
                      </div>
                      <div>
                        <label>Date of Birth</label>
                        <input
                          value=${form.dateOfBirth}
                          onInput=${e =>
                            setForm({ ...form, dateOfBirth: e.target.value })}
                        />
                      </div>
                    </div>
                    <div className="row">
                      <div>
                        <label>Cellphone Number</label>
                        <input
                          value=${form.cellphone}
                          onInput=${e => setForm({ ...form, cellphone: e.target.value })}
                        />
                      </div>
                      <div>
                        <label>Email</label>
                        <input
                          value=${form.email}
                          onInput=${e => setForm({ ...form, email: e.target.value })}
                        />
                      </div>
                    </div>
                    <div className="row">
                      <div>
                        <label>Played previously</label>
                        <select
                          value=${form.playedBefore}
                          onChange=${e => setForm({ ...form, playedBefore: e.target.value })}
                        >
                          <option value="no">No</option>
                          <option value="yes">Yes</option>
                        </select>
                      </div>
                      <div>
                        <label>Apto Medico</label>
                        <select
                          value=${form.aptoMedico}
                          onChange=${e => setForm({ ...form, aptoMedico: e.target.value })}
                        >
                          <option value="no">No</option>
                          <option value="yes">Yes</option>
                        </select>
                      </div>
                    </div>
                    <div className="row">
                      <div>
                        <label>Referencia</label>
                        <select
                          value=${form.referencia}
                          onChange=${e => setForm({ ...form, referencia: e.target.value })}
                        >
                          <option value="">Select</option>
                          <option value="Padre de Alumno">Padre de Alumno</option>
                          <option value="Padre de ex Alumno">Padre de ex Alumno</option>
                          <option value="Ex alumno">Ex alumno</option>
                          <option value="Docente">Docente</option>
                          <option value="Invitado">Invitado</option>
                          <option value="Hermano marista">Hermano marista</option>
                          <option value="Esposo educadora">Esposo educadora</option>
                          <option value="Abuelo de alumno">Abuelo de alumno</option>
                        </select>
                      </div>
                      <div>
                        <label>Ano de Egreso</label>
                        <input
                          type="number"
                          value=${form.egresoYear}
                          onInput=${e => setForm({ ...form, egresoYear: e.target.value })}
                        />
                      </div>
                    </div>
                    <button className="portal-button">Create account</button>
                    <a className="portal-button secondary" href="login.html">
                      Already registered? Log in
                    </a>
                  </div>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      ReactDOM.createRoot(document.getElementById("app")).render(html`<${App} />`);
    </script>
  </body>
</html>
