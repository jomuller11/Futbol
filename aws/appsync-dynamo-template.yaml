AWSTemplateFormatVersion: '2010-09-09'
Description: AppSync GraphQL API with DynamoDB tables for tournaments admin

Resources:
  TournamentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Tournaments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PhasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Phases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: tournamentId
          AttributeType: S
        - AttributeName: phaseOrder
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byTournament
          KeySchema:
            - AttributeName: tournamentId
              KeyType: HASH
            - AttributeName: phaseOrder
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phaseId
          AttributeType: S
        - AttributeName: groupOrder
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byPhase
          KeySchema:
            - AttributeName: phaseId
              KeyType: HASH
            - AttributeName: groupOrder
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Teams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: tournamentId
          AttributeType: S
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byTournament
          KeySchema:
            - AttributeName: tournamentId
              KeyType: HASH
            - AttributeName: name
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  RoundsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Rounds
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phaseId
          AttributeType: S
        - AttributeName: roundOrder
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byPhase
          KeySchema:
            - AttributeName: phaseId
              KeyType: HASH
            - AttributeName: roundOrder
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TeamAssignments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phaseId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: roundId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byPhase
          KeySchema:
            - AttributeName: phaseId
              KeyType: HASH
            - AttributeName: teamId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byGroup
          KeySchema:
            - AttributeName: groupId
              KeyType: HASH
            - AttributeName: teamId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byRound
          KeySchema:
            - AttributeName: roundId
              KeyType: HASH
            - AttributeName: teamId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: HelloAppSyncApi
      AuthenticationType: API_KEY

  ApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      # Intentionally no Expires to avoid ApiKeyValidityOutOfBoundsException

  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Definition: |
        enum PhaseType {
          ZONES
          PLAYOFFS
        }

        type Tournament {
          id: ID!
          name: String!
          season: String
          startDate: String
          endDate: String
          isActive: Boolean
        }

        type Phase {
          id: ID!
          tournamentId: ID!
          name: String!
          phaseType: PhaseType!
          phaseOrder: Int!
        }

        type Group {
          id: ID!
          phaseId: ID!
          name: String!
          groupOrder: Int!
        }

        type Round {
          id: ID!
          phaseId: ID!
          name: String!
          roundOrder: Int!
        }

        type Team {
          id: ID!
          tournamentId: ID!
          name: String!
          shortName: String
        }

        type Assignment {
          id: ID!
          tournamentId: ID!
          phaseId: ID!
          teamId: ID!
          groupId: ID
          roundId: ID
        }

        input CreateTournamentInput {
          id: ID
          name: String!
          season: String
          startDate: String
          endDate: String
          isActive: Boolean
        }

        input UpdateTournamentInput {
          id: ID!
          name: String!
          season: String
          startDate: String
          endDate: String
          isActive: Boolean
        }

        input CreatePhaseInput {
          id: ID
          tournamentId: ID!
          name: String!
          phaseType: PhaseType!
          phaseOrder: Int!
        }

        input UpdatePhaseInput {
          id: ID!
          tournamentId: ID!
          name: String!
          phaseType: PhaseType!
          phaseOrder: Int!
        }

        input CreateGroupInput {
          id: ID
          phaseId: ID!
          name: String!
          groupOrder: Int!
        }

        input UpdateGroupInput {
          id: ID!
          phaseId: ID!
          name: String!
          groupOrder: Int!
        }

        input CreateRoundInput {
          id: ID
          phaseId: ID!
          name: String!
          roundOrder: Int!
        }

        input UpdateRoundInput {
          id: ID!
          phaseId: ID!
          name: String!
          roundOrder: Int!
        }

        input CreateTeamInput {
          id: ID
          tournamentId: ID!
          name: String!
          shortName: String
        }

        input UpdateTeamInput {
          id: ID!
          tournamentId: ID!
          name: String!
          shortName: String
        }

        input AssignTeamInput {
          tournamentId: ID!
          phaseId: ID!
          teamId: ID!
          groupId: ID
          roundId: ID
        }

        type Query {
          getTournament(id: ID!): Tournament
          listTournaments: [Tournament!]!
          listPhasesByTournament(tournamentId: ID!): [Phase!]!
          listGroupsByPhase(phaseId: ID!): [Group!]!
          listRoundsByPhase(phaseId: ID!): [Round!]!
          listTeamsByTournament(tournamentId: ID!): [Team!]!
          listAssignmentsByPhase(phaseId: ID!): [Assignment!]!
          listAssignmentsByGroup(groupId: ID!): [Assignment!]!
          listAssignmentsByRound(roundId: ID!): [Assignment!]!
        }

        type Mutation {
          createTournament(input: CreateTournamentInput!): Tournament!
          updateTournament(input: UpdateTournamentInput!): Tournament!
          createPhase(input: CreatePhaseInput!): Phase!
          updatePhase(input: UpdatePhaseInput!): Phase!
          createGroup(input: CreateGroupInput!): Group!
          updateGroup(input: UpdateGroupInput!): Group!
          createRound(input: CreateRoundInput!): Round!
          updateRound(input: UpdateRoundInput!): Round!
          createTeam(input: CreateTeamInput!): Team!
          updateTeam(input: UpdateTeamInput!): Team!
          assignTeamToPhase(input: AssignTeamInput!): Assignment!
        }

        schema {
          query: Query
          mutation: Mutation
        }

  AppSyncDynamoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - appsync.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TournamentsTable.Arn
                  - !GetAtt PhasesTable.Arn
                  - !Sub "${PhasesTable.Arn}/index/*"
                  - !GetAtt GroupsTable.Arn
                  - !Sub "${GroupsTable.Arn}/index/*"
                  - !GetAtt TeamsTable.Arn
                  - !Sub "${TeamsTable.Arn}/index/*"
                  - !GetAtt RoundsTable.Arn
                  - !Sub "${RoundsTable.Arn}/index/*"
                  - !GetAtt AssignmentsTable.Arn
                  - !Sub "${AssignmentsTable.Arn}/index/*"

  TournamentsDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - AppSyncDynamoRole
      - TournamentsTable
      - GraphQLApi
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: TournamentsSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        TableName: !Ref TournamentsTable
        AwsRegion: !Ref AWS::Region

