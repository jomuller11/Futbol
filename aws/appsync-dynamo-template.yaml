  CreateTournamentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - TournamentsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createTournament
      DataSourceName: TournamentsSource
      RequestMappingTemplate: |
        #set($tournamentId = $util.defaultIfNull($ctx.args.input.id, $util.autoId()))
        $util.qr($ctx.stash.put("tournamentId", $tournamentId))
        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($tournamentId)
          },
          "attributeValues": {
            "name": $util.dynamodb.toDynamoDBJson($ctx.args.input.name),
            "season": $util.dynamodb.toDynamoDBJson($ctx.args.input.season),
            "startDate": $util.dynamodb.toDynamoDBJson($ctx.args.input.startDate),
            "endDate": $util.dynamodb.toDynamoDBJson($ctx.args.input.endDate),
            "isActive": $util.dynamodb.toDynamoDBJson($util.defaultIfNull($ctx.args.input.isActive, false))
          }
        }
      ResponseMappingTemplate: |
        #set($result = {})
        $util.qr($result.put("id", $ctx.stash.tournamentId))
        $util.qr($result.put("name", $ctx.args.input.name))
        $util.qr($result.put("season", $ctx.args.input.season))
        $util.qr($result.put("startDate", $ctx.args.input.startDate))
        $util.qr($result.put("endDate", $ctx.args.input.endDate))
        $util.qr($result.put("isActive", $util.defaultIfNull($ctx.args.input.isActive, false)))
        $util.toJson($result)

