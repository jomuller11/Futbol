AWSTemplateFormatVersion: '2010-09-09'
Description: AppSync GraphQL API with DynamoDB tables for tournaments admin

Resources:
  TournamentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Tournaments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PhasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Phases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: tournamentId
          AttributeType: S
        - AttributeName: phaseOrder
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byTournament
          KeySchema:
            - AttributeName: tournamentId
              KeyType: HASH
            - AttributeName: phaseOrder
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phaseId
          AttributeType: S
        - AttributeName: groupOrder
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byPhase
          KeySchema:
            - AttributeName: phaseId
              KeyType: HASH
            - AttributeName: groupOrder
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Teams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: tournamentId
          AttributeType: S
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byTournament
          KeySchema:
            - AttributeName: tournamentId
              KeyType: HASH
            - AttributeName: name
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: HelloAppSyncApi
      AuthenticationType: API_KEY

  ApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      # Intentionally no Expires to avoid ApiKeyValidityOutOfBoundsException

  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Definition: |
        enum PhaseType {
          ZONES
          PLAYOFFS
        }

        type Tournament {
          id: ID!
          name: String!
          season: String
          startDate: String
          endDate: String
        }

        type Phase {
          id: ID!
          tournamentId: ID!
          name: String!
          phaseType: PhaseType!
          phaseOrder: Int!
        }

        type Group {
          id: ID!
          phaseId: ID!
          name: String!
          groupOrder: Int!
        }

        type Team {
          id: ID!
          tournamentId: ID!
          name: String!
          shortName: String
        }

        input CreateTournamentInput {
          id: ID
          name: String!
          season: String
          startDate: String
          endDate: String
        }

        input CreatePhaseInput {
          id: ID
          tournamentId: ID!
          name: String!
          phaseType: PhaseType!
          phaseOrder: Int!
        }

        input CreateGroupInput {
          id: ID
          phaseId: ID!
          name: String!
          groupOrder: Int!
        }

        input CreateTeamInput {
          id: ID
          tournamentId: ID!
          name: String!
          shortName: String
        }

        type Query {
          getTournament(id: ID!): Tournament
          listTournaments: [Tournament!]!
          listPhasesByTournament(tournamentId: ID!): [Phase!]!
          listGroupsByPhase(phaseId: ID!): [Group!]!
          listTeamsByTournament(tournamentId: ID!): [Team!]!
        }

        type Mutation {
          createTournament(input: CreateTournamentInput!): Tournament!
          createPhase(input: CreatePhaseInput!): Phase!
          createGroup(input: CreateGroupInput!): Group!
          createTeam(input: CreateTeamInput!): Team!
        }

        schema {
          query: Query
          mutation: Mutation
        }

  AppSyncDynamoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - appsync.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TournamentsTable.Arn
                  - !GetAtt PhasesTable.Arn
                  - !Sub "${PhasesTable.Arn}/index/*"
                  - !GetAtt GroupsTable.Arn
                  - !Sub "${GroupsTable.Arn}/index/*"
                  - !GetAtt TeamsTable.Arn
                  - !Sub "${TeamsTable.Arn}/index/*"

  TournamentsDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - AppSyncDynamoRole
      - TournamentsTable
      - GraphQLApi
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: TournamentsSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        TableName: !Ref TournamentsTable
        AwsRegion: !Ref AWS::Region

  PhasesDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - AppSyncDynamoRole
      - PhasesTable
      - GraphQLApi
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: PhasesSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        TableName: !Ref PhasesTable
        AwsRegion: !Ref AWS::Region

  GroupsDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - AppSyncDynamoRole
      - GroupsTable
      - GraphQLApi
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: GroupsSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        TableName: !Ref GroupsTable
        AwsRegion: !Ref AWS::Region

  TeamsDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - AppSyncDynamoRole
      - TeamsTable
      - GraphQLApi
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: TeamsSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        TableName: !Ref TeamsTable
        AwsRegion: !Ref AWS::Region

  GetTournamentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - TournamentsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getTournament
      DataSourceName: TournamentsSource
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "GetItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($ctx.args.id)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  ListTournamentsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - TournamentsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listTournaments
      DataSourceName: TournamentsSource
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Scan"
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result.items)

  CreateTournamentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - TournamentsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createTournament
      DataSourceName: TournamentsSource
      RequestMappingTemplate: |
        #set($tournamentId = $util.defaultIfNull($ctx.args.input.id, $util.autoId()))
        $util.qr($ctx.stash.put("tournamentId", $tournamentId))
        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($tournamentId)
          },
          "attributeValues": {
            "name": $util.dynamodb.toDynamoDBJson($ctx.args.input.name),
            "season": $util.dynamodb.toDynamoDBJson($ctx.args.input.season),
            "startDate": $util.dynamodb.toDynamoDBJson($ctx.args.input.startDate),
            "endDate": $util.dynamodb.toDynamoDBJson($ctx.args.input.endDate)
          }
        }
      ResponseMappingTemplate: |
        #set($result = {})
        $util.qr($result.put("id", $ctx.stash.tournamentId))
        $util.qr($result.put("name", $ctx.args.input.name))
        $util.qr($result.put("season", $ctx.args.input.season))
        $util.qr($result.put("startDate", $ctx.args.input.startDate))
        $util.qr($result.put("endDate", $ctx.args.input.endDate))
        $util.toJson($result)

  ListPhasesByTournamentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - PhasesDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listPhasesByTournament
      DataSourceName: PhasesSource
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Query",
          "index": "byTournament",
          "query": {
            "expression": "tournamentId = :tournamentId",
            "expressionValues": {
              ":tournamentId": $util.dynamodb.toDynamoDBJson($ctx.args.tournamentId)
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result.items)

  CreatePhaseResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - PhasesDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createPhase
      DataSourceName: PhasesSource
      RequestMappingTemplate: |
        #set($phaseId = $util.defaultIfNull($ctx.args.input.id, $util.autoId()))
        $util.qr($ctx.stash.put("phaseId", $phaseId))
        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($phaseId)
          },
          "attributeValues": {
            "tournamentId": $util.dynamodb.toDynamoDBJson($ctx.args.input.tournamentId),
            "name": $util.dynamodb.toDynamoDBJson($ctx.args.input.name),
            "phaseType": $util.dynamodb.toDynamoDBJson($ctx.args.input.phaseType),
            "phaseOrder": $util.dynamodb.toDynamoDBJson($ctx.args.input.phaseOrder)
          }
        }
      ResponseMappingTemplate: |
        #set($result = {})
        $util.qr($result.put("id", $ctx.stash.phaseId))
        $util.qr($result.put("tournamentId", $ctx.args.input.tournamentId))
        $util.qr($result.put("name", $ctx.args.input.name))
        $util.qr($result.put("phaseType", $ctx.args.input.phaseType))
        $util.qr($result.put("phaseOrder", $ctx.args.input.phaseOrder))
        $util.toJson($result)

  ListGroupsByPhaseResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GroupsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listGroupsByPhase
      DataSourceName: GroupsSource
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Query",
          "index": "byPhase",
          "query": {
            "expression": "phaseId = :phaseId",
            "expressionValues": {
              ":phaseId": $util.dynamodb.toDynamoDBJson($ctx.args.phaseId)
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result.items)

  CreateGroupResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GroupsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createGroup
      DataSourceName: GroupsSource
      RequestMappingTemplate: |
        #set($groupId = $util.defaultIfNull($ctx.args.input.id, $util.autoId()))
        $util.qr($ctx.stash.put("groupId", $groupId))
        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($groupId)
          },
          "attributeValues": {
            "phaseId": $util.dynamodb.toDynamoDBJson($ctx.args.input.phaseId),
            "name": $util.dynamodb.toDynamoDBJson($ctx.args.input.name),
            "groupOrder": $util.dynamodb.toDynamoDBJson($ctx.args.input.groupOrder)
          }
        }
      ResponseMappingTemplate: |
        #set($result = {})
        $util.qr($result.put("id", $ctx.stash.groupId))
        $util.qr($result.put("phaseId", $ctx.args.input.phaseId))
        $util.qr($result.put("name", $ctx.args.input.name))
        $util.qr($result.put("groupOrder", $ctx.args.input.groupOrder))
        $util.toJson($result)

  ListTeamsByTournamentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - TeamsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listTeamsByTournament
      DataSourceName: TeamsSource
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Query",
          "index": "byTournament",
          "query": {
            "expression": "tournamentId = :tournamentId",
            "expressionValues": {
              ":tournamentId": $util.dynamodb.toDynamoDBJson($ctx.args.tournamentId)
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result.items)

  CreateTeamResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - TeamsDataSource
      - GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createTeam
      DataSourceName: TeamsSource
      RequestMappingTemplate: |
        #set($teamId = $util.defaultIfNull($ctx.args.input.id, $util.autoId()))
        $util.qr($ctx.stash.put("teamId", $teamId))
        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($teamId)
          },
          "attributeValues": {
            "tournamentId": $util.dynamodb.toDynamoDBJson($ctx.args.input.tournamentId),
            "name": $util.dynamodb.toDynamoDBJson($ctx.args.input.name),
            "shortName": $util.dynamodb.toDynamoDBJson($ctx.args.input.shortName)
          }
        }
      ResponseMappingTemplate: |
        #set($result = {})
        $util.qr($result.put("id", $ctx.stash.teamId))
        $util.qr($result.put("tournamentId", $ctx.args.input.tournamentId))
        $util.qr($result.put("name", $ctx.args.input.name))
        $util.qr($result.put("shortName", $ctx.args.input.shortName))
        $util.toJson($result)

Outputs:
  GraphQLApiUrl:
    Description: GraphQL endpoint URL
    Value: !GetAtt GraphQLApi.GraphQLUrl
  ApiKeyValue:
    Description: API key for the AppSync API
    Value: !Ref ApiKey
